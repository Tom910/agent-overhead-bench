name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify current report matches canonical data (offline)
        run: npm run report:check
      - uses: docker/setup-buildx-action@v3
      - name: Build and validate zero-spend adapter images
        env:
          AOB_DOCKER_CACHE_FROM: type=gha,scope=aob-images
          AOB_DOCKER_CACHE_TO: type=gha,scope=aob-images,mode=max
        run: scripts/s5-build-images.sh
      - name: Exercise Docker-to-host proxy route without provider traffic
        run: npm run docker-route-smoke --workspace @aob/runner
